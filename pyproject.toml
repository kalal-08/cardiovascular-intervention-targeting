[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiovascular-intervention-targeting"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.9", "numpy>=1.26", "pandas>=2.2", "statsmodels>=0.14.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not local_only'"
markers = ["local_only: preservation checks requiring excluded internal documentation"]
